name: Deploy gallery

# gallery.theoazriel.com. Deploys are per-app so a notes edit does not republish the
# gallery, and vice versa; the root lockfile is in both filters because it
# can change either app's build.
on:
  push:
    branches: [main]
    paths:
      - 'apps/gallery/**'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.github/workflows/deploy-gallery.yml'
      - '.nvmrc'
  workflow_dispatch:

# a deploy already in flight is publishing older commits than the one that
# just landed, so let it be replaced rather than race
concurrency:
  group: deploy-gallery
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # tsc -b && vite build — a type error fails here, before anything ships
      - run: bun run build:gallery

      - run: bun run deploy:gallery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
