name: Check

# Runs on every pull request so a broken build or unformatted file is caught
# before it lands on main, where the deploy workflows would ship it.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # prettier, eslint, astro check + build, tsc + vite build, and a
      # dry-run deploy of the two Workers that have no build step
      - run: bun run check
