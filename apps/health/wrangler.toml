name = "theo-health"
main = "cloud/worker.js"
compatibility_date = "2026-09-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = "./dist-public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[routes]]
pattern = "theoazriel.com/health*"
zone_name = "theoazriel.com"

[[durable_objects.bindings]]
name = "HEALTH"
class_name = "HealthFeed"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HealthFeed"]
