<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>404 — Theo Azriel</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #fdfdfc;
        --ink: #1c1c1a;
        --muted: #969693;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 40px 32px;
        background: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.45;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 1px solid var(--ink);
        outline-offset: 4px;
      }
      img {
        display: block;
      }
      p {
        margin: 3.5rem 0 0;
        font-size: 19px;
        font-weight: 500;
      }
      .back {
        margin-top: 1rem;
        color: var(--muted);
        font-size: 15px;
        transition: color 160ms ease;
      }
      .back:hover {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <a href="/" aria-label="Theo Azriel gallery"
      ><picture
        ><source srcset="/mark-dark.png" media="(prefers-color-scheme: dark)" />
        <img src="/mark.png" alt="" width="160" height="160" /></picture
    ></a>
    <p>404 — nothing here</p>
    <a class="back" href="/">Back to the photographs</a>
  </body>
</html>
