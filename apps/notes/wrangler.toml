name = "theo-notes"
compatibility_date = "2026-08-05"
workers_dev = true
# Only /api/ requests run this script; everything else is served from dist.
main = "worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"

# The site serves the root domain; notes.theoazriel.com stays attached so
# links to the old subdomain keep resolving (a redirect rule in the
# Cloudflare dashboard can later send it to theoazriel.com properly).
[[routes]]
pattern = "theoazriel.com"
custom_domain = true

[[routes]]
pattern = "notes.theoazriel.com"
custom_domain = true


# The ink drops visitors leave on the homepage: one small SQLite-backed object
# holds the newest few dozen for a week.
[[durable_objects.bindings]]
name = "INK_DROPS"
class_name = "InkDrops"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InkDrops"]
